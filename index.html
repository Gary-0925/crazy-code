<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ 源代码混淆器</title>
    <style>
        body {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', monospace;
            margin: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #569cd6;
            border-bottom: 1px solid #3e3e42;
            padding-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #2d2d30;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            padding: 10px;
            resize: vertical;
            white-space: pre;
            overflow: auto;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
            border-radius: 4px;
        }

        button:hover {
            background: #1177bb;
        }

        .output {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            padding: 10px;
            height: 300px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            word-break: break-all;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #6a9955;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>C++ 源代码混淆器</h1>
        <p>仅供娱乐使用</p>
        <textarea id="input" placeholder="输入你的 C++ 代码"></textarea>
        <br>
        <button onclick="obfuscate()">混淆</button>
        <textarea id="output" class="output" placeholder="混淆结果"></textarea>
    </div>

    <script>
        (function () {
            // ---------- 工具函数 ----------
            // 根据长度生成填充字符串
            function makePadding(len) {
                if (len >= 4) {
                    let ans = "";
                    while (len > 0) {
                        if (len >= 5) {
                            let spaceLen = Math.min(len - 5, Math.floor(Math.random() * 11)); // 注释内空格长度随机 0~10
                            ans += ' /*' + ' '.repeat(spaceLen) + '*/';
                            len -= 5 + spaceLen;
                        } else {
                            ans += ' '.repeat(len);
                            len = 0;
                        }
                    }
                    return ans;
                } else {
                    return ' '.repeat(len);
                }
            }

            // 将索引转换为宏名 _000AAA 格式 (idx 从0开始)
            function idxToMacro(idx, prefix = '_') {
                const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const totalLetters = 26 * 26 * 26; // 17576
                let numPart = Math.floor(idx / totalLetters);
                let letterPart = idx % totalLetters;
                let l1 = letters[Math.floor(letterPart / 676)];
                let l2 = letters[Math.floor((letterPart % 676) / 26)];
                let l3 = letters[letterPart % 26];
                let numStr = numPart.toString().padStart(3, '0');
                return prefix + numStr + l1 + l2 + l3;
            }

            // 词法分析：收集行中所有标识符（排除字符串/字符/注释）
            function collectIdentifiers(line, idSet) {
                let i = 0;
                const len = line.length;
                let state = 'normal';
                while (i < len) {
                    const ch = line[i];
                    if (state === 'normal') {
                        if (ch === '/' && i + 1 < len) {
                            if (line[i + 1] === '/') { // 行注释，跳过剩余
                                break;
                            } else if (line[i + 1] === '*') { // 块注释开始
                                state = 'blockComment';
                                i += 2;
                                continue;
                            }
                        }
                        if (ch === '"') {
                            state = 'string';
                            i++;
                            continue;
                        }
                        if (ch === '\'') {
                            state = 'char';
                            i++;
                            continue;
                        }
                        if (/[a-zA-Z_]/.test(ch)) { // 标识符开始
                            let start = i;
                            while (i < len && /[a-zA-Z0-9_]/.test(line[i])) i++;
                            let ident = line.substring(start, i);
                            idSet.add(ident);
                            continue;
                        } else {
                            i++;
                        }
                    } else if (state === 'string') {
                        if (ch === '\\') i += 2;
                        else if (ch === '"') { state = 'normal'; i++; }
                        else i++;
                    } else if (state === 'char') {
                        if (ch === '\\') i += 2;
                        else if (ch === '\'') { state = 'normal'; i++; }
                        else i++;
                    } else if (state === 'blockComment') {
                        if (ch === '*' && i + 1 < len && line[i + 1] === '/') {
                            state = 'normal';
                            i += 2;
                        } else {
                            i++;
                        }
                    }
                }
            }

            // 替换行中的标识符为宏名，并返回 token 序列（用空格分隔）
            function replaceLine(line, macroMap) {
                let tokens = [];
                let i = 0;
                const len = line.length;
                let state = 'normal';
                while (i < len) {
                    const ch = line[i];
                    if (state === 'normal') {
                        if (ch === '/' && i + 1 < len) {
                            if (line[i + 1] === '/') { // 行注释，跳过剩余，不输出
                                break;
                            } else if (line[i + 1] === '*') { // 块注释，跳过
                                state = 'blockComment';
                                i += 2;
                                continue;
                            }
                        }
                        if (ch === '"') {
                            // 字符串整体作为一个 token
                            let start = i;
                            i++;
                            while (i < len) {
                                if (line[i] === '\\' && i + 1 < len) i += 2;
                                else if (line[i] === '"') break;
                                else i++;
                            }
                            if (i < len) i++; // 跳过闭引号
                            tokens.push(line.substring(start, i));
                            continue;
                        }
                        if (ch === '\'') {
                            let start = i;
                            i++;
                            while (i < len) {
                                if (line[i] === '\\' && i + 1 < len) i += 2;
                                else if (line[i] === '\'') break;
                                else i++;
                            }
                            if (i < len) i++;
                            tokens.push(line.substring(start, i));
                            continue;
                        }
                        if (/[a-zA-Z_]/.test(ch)) {
                            let start = i;
                            while (i < len && /[a-zA-Z0-9_]/.test(line[i])) i++;
                            let ident = line.substring(start, i);
                            let macro = macroMap.get(ident);
                            tokens.push(macro); // 标识符替换为宏名
                            continue;
                        }
                        // 处理操作符/数字/标点：单独作为一个 token
                        if (!/\s/.test(ch)) {
                            let start = i;
                            // 收集连续非空白字符（即一个 token）
                            while (i < len && !/\s/.test(line[i]) && line[i] !== '"' && line[i] !== '\'' && !(line[i] === '/' && i + 1 < len && (line[i + 1] == '/' || line[i + 1] == '*'))) {
                                i++;
                            }
                            let tok = line.substring(start, i);
                            tokens.push(tok);
                            continue;
                        } else {
                            // 空白跳过
                            i++;
                        }
                    } else if (state === 'blockComment') {
                        if (ch === '*' && i + 1 < len && line[i + 1] === '/') {
                            state = 'normal';
                            i += 2;
                        } else {
                            i++;
                        }
                    } else {
                        i++;
                    }
                }
                // 用空格连接所有 token
                return tokens.join(' ');
            }

            // 新的填充函数：在 token 之间随机插入注释，使行长度达到 targetLen
            function insertPadding(line, targetLen) {
                // 将行按空白分割成 token 数组（忽略原始空白，重新构建）
                const tokens = line.split(/\s+/).filter(t => t.length > 0);
                if (tokens.length === 0) {
                    // 空行，直接填充空格
                    return ' '.repeat(targetLen);
                }

                // 计算基础长度（用单个空格分隔的字符串长度）
                const baseLen = tokens.join(' ').length;
                if (baseLen >= targetLen) {
                    return line; // 已经足够，但通常不会
                }

                let need = targetLen - baseLen;

                // 间隙数量 = token数 + 1（开头和结尾也可以插入填充）
                const gaps = tokens.length + 1;
                // 初始化每个间隙的填充量
                const fill = new Array(gaps).fill(0);

                // 随机分配 need 到各个间隙
                while (need > 0) {
                    // 随机选择一个间隙
                    const idx = Math.floor(Math.random() * gaps);
                    // 决定本次填充长度
                    let len;
                    if (need >= 4) {
                        // 随机 4 到 need 之间
                        len = Math.floor(Math.random() * (need - 3)) + 4;
                    } else {
                        len = need; // 剩余不足4，只能加空格
                    }
                    fill[idx] += len;
                    need -= len;
                }

                // 构建最终行
                let result = '';

                // 开头填充
                if (fill[0] > 0) {
                    result += makePadding(fill[0]);
                }

                for (let i = 0; i < tokens.length; i++) {
                    result += tokens[i];
                    // 如果不是最后一个token，或者最后一个token后需要填充
                    if (i < tokens.length - 1) {
                        // token 之间至少加一个空格（保证分隔）
                        result += ' ';
                        if (fill[i + 1] > 0) {
                            result += makePadding(fill[i + 1]);
                        }
                    } else {
                        // 最后一个token后面
                        if (fill[tokens.length] > 0) {
                            // 如果最后一个token后有填充，直接追加（无需额外空格，填充本身可能含空格）
                            result += makePadding(fill[tokens.length]);
                        }
                    }
                }

                return result;
            }

            // 主混淆函数
            window.obfuscate = function () {
                const input = document.getElementById('input').value;
                if (!input.trim()) {
                    document.getElementById('output').value = '';
                    return;
                }

                const lines = input.split('\n');
                const preprocessLines = [];   // 预处理指令行（以#开头，忽略前面空白）
                const codeLines = [];         // 普通代码行

                for (let rawLine of lines) {
                    const trimmed = rawLine.trim();
                    if (trimmed.startsWith('#')) {
                        preprocessLines.push(rawLine); // 保留原行（包括缩进）
                    } else {
                        if (rawLine.trim() !== '') {
                            codeLines.push(rawLine);
                        }
                    }
                }

                // 第一遍：收集所有代码行中的标识符
                const idSet = new Set();
                for (let line of codeLines) {
                    collectIdentifiers(line, idSet);
                }

                // 将标识符排序，分配宏名 (格式 _000AAA)
                const sortedIds = Array.from(idSet).sort();
                const macroMap = new Map();
                let idx = 0;
                for (let i = 0; i < sortedIds.length; i++) {
                    macroMap.set(sortedIds[i], idxToMacro(idx, '_'));
                    idx++;
                }

                // 第二遍：替换每行代码，生成该行的替换后内容
                const replacedLines = codeLines.map(line => replaceLine(line, macroMap));

                // 生成所有标识符的宏定义行
                const identMacroLines = [];
                for (let [ident, macro] of macroMap.entries()) {
                    identMacroLines.push(`#define ${macro} ${ident}`);
                }

                // 生成行宏定义：为每一行代码生成一个宏名
                const lineMacroLines = [];
                const lineMacroNames = [];
                for (let i = 0; i < replacedLines.length; i++) {
                    const lineMacro = idxToMacro(idx, '_');
                    lineMacroNames.push(lineMacro);
                    lineMacroLines.push(`#define ${lineMacro} ${replacedLines[i]}`);
                    idx++;
                }

                // 生成顶级宏 _FINAL
                const finalMacroName = '_FINAL';
                const finalMacroBody = lineMacroNames.join(' ');
                const finalMacroLine = `#define ${finalMacroName} ${finalMacroBody}`;
                const finalCallLine = finalMacroName;

                // 收集所有需要填充长度的行（标识符宏定义、行宏定义、最终宏定义、最终调用行）
                const allLinesToPad = [
                    ...identMacroLines,
                    ...lineMacroLines,
                    finalMacroLine,
                    finalCallLine
                ];

                // 计算最大长度（基于原始行，不含填充）
                let maxLen = 0;
                for (let line of allLinesToPad) {
                    if (line.length > maxLen) maxLen = line.length;
                }
                // 目标长度 = 最大长度 + 随机偏移 10~30
                const targetLen = maxLen + Math.floor(Math.random() * 20) + 10;

                // 使用新的插入填充函数处理每一行
                const paddedIdent = identMacroLines.map(l => insertPadding(l, targetLen));
                const paddedLineMacros = lineMacroLines.map(l => insertPadding(l, targetLen));
                const paddedFinalMacro = insertPadding(finalMacroLine, targetLen);
                const paddedFinalCall = insertPadding(finalCallLine, targetLen);

                // 组装输出
                let output = '';
                // 预处理指令原样输出
                for (let pl of preprocessLines) {
                    output += pl + '\n';
                }
                if (preprocessLines.length > 0) output += '\n'; // 空行分隔

                // 标识符宏定义
                for (let line of paddedIdent) {
                    output += line + '\n';
                }
                // 行宏定义
                for (let line of paddedLineMacros) {
                    output += line + '\n';
                }
                // 最终宏定义
                output += paddedFinalMacro + '\n';
                // 最终调用
                output += paddedFinalCall + '\n';

                document.getElementById('output').value = output;
            };
        })();
    </script>
</body>

</html>
