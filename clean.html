<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ 源代码混淆器</title>
    <style>
        body {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', monospace;
            margin: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #569cd6;
            border-bottom: 1px solid #3e3e42;
            padding-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #2d2d30;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            padding: 10px;
            resize: vertical;
            white-space: pre;
            overflow: auto;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
            border-radius: 4px;
        }

        button:hover {
            background: #1177bb;
        }

        .output {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            padding: 10px;
            height: 300px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            word-break: break-all;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #6a9955;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>C++ 源代码混淆器</h1>
        <p>仅供娱乐使用</p>
        <textarea id="input" placeholder="输入你的 C++ 代码"></textarea>
        <br>
        <button onclick="obfuscate()">混淆</button>
        <textarea id="output" class="output" placeholder="混淆结果"></textarea>
    </div>

    <script>
        (function () {
            // ---------- 工具函数 ----------
            // 根据长度生成填充字符串
            function makePadding(len) {
                return '';
            }

            // 将索引转换为宏名 _000AAA 格式 (idx 从0开始)
            function idxToMacro(idx, prefix = '_') {
                const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const totalLetters = 26 * 26 * 26; // 17576
                let numPart = Math.floor(idx / totalLetters);
                let letterPart = idx % totalLetters;
                let l1 = letters[Math.floor(letterPart / 676)];
                let l2 = letters[Math.floor((letterPart % 676) / 26)];
                let l3 = letters[letterPart % 26];
                let numStr = numPart.toString().padStart(3, '0');
                return prefix + numStr + l1 + l2 + l3;
            }

            // 词法分析：收集行中所有标识符（排除字符串/字符/注释）
            function collectIdentifiers(line, idSet) {
                let i = 0;
                const len = line.length;
                let state = 'normal';
                while (i < len) {
                    const ch = line[i];
                    if (state === 'normal') {
                        if (ch === '/' && i + 1 < len) {
                            if (line[i + 1] === '/') { // 行注释，跳过剩余
                                break;
                            } else if (line[i + 1] === '*') { // 块注释开始
                                state = 'blockComment';
                                i += 2;
                                continue;
                            }
                        }
                        if (ch === '"') {
                            state = 'string';
                            i++;
                            continue;
                        }
                        if (ch === '\'') {
                            state = 'char';
                            i++;
                            continue;
                        }
                        if (/[a-zA-Z_]/.test(ch)) { // 标识符开始
                            let start = i;
                            while (i < len && /[a-zA-Z0-9_]/.test(line[i])) i++;
                            let ident = line.substring(start, i);
                            idSet.add(ident);
                            continue;
                        } else {
                            i++;
                        }
                    } else if (state === 'string') {
                        if (ch === '\\') i += 2;
                        else if (ch === '"') { state = 'normal'; i++; }
                        else i++;
                    } else if (state === 'char') {
                        if (ch === '\\') i += 2;
                        else if (ch === '\'') { state = 'normal'; i++; }
                        else i++;
                    } else if (state === 'blockComment') {
                        if (ch === '*' && i + 1 < len && line[i + 1] === '/') {
                            state = 'normal';
                            i += 2;
                        } else {
                            i++;
                        }
                    }
                }
            }

            // 替换行中的标识符为宏名，并返回 token 数组（每个 token 是字符串或宏名）
            function replaceLine(line, macroMap) {
                let tokens = [];
                let i = 0;
                const len = line.length;
                let state = 'normal';
                while (i < len) {
                    const ch = line[i];
                    if (state === 'normal') {
                        if (ch === '/' && i + 1 < len) {
                            if (line[i + 1] === '/') { // 行注释，跳过剩余，不输出
                                break;
                            } else if (line[i + 1] === '*') { // 块注释，跳过
                                state = 'blockComment';
                                i += 2;
                                continue;
                            }
                        }
                        if (ch === '"') {
                            // 字符串整体作为一个 token
                            let start = i;
                            i++;
                            while (i < len) {
                                if (line[i] === '\\' && i + 1 < len) i += 2;
                                else if (line[i] === '"') break;
                                else i++;
                            }
                            if (i < len) i++; // 跳过闭引号
                            tokens.push(line.substring(start, i));
                            continue;
                        }
                        if (ch === '\'') {
                            let start = i;
                            i++;
                            while (i < len) {
                                if (line[i] === '\\' && i + 1 < len) i += 2;
                                else if (line[i] === '\'') break;
                                else i++;
                            }
                            if (i < len) i++;
                            tokens.push(line.substring(start, i));
                            continue;
                        }
                        if (/[a-zA-Z_]/.test(ch)) {
                            let start = i;
                            while (i < len && /[a-zA-Z0-9_]/.test(line[i])) i++;
                            let ident = line.substring(start, i);
                            let macro = macroMap.get(ident);
                            tokens.push(macro); // 标识符替换为宏名
                            continue;
                        }
                        // 处理操作符/数字/标点：单独作为一个 token
                        if (!/\s/.test(ch)) {
                            let start = i;
                            // 收集连续非空白字符（即一个 token）
                            while (i < len && !/\s/.test(line[i]) && line[i] !== '"' && line[i] !== '\'' && !(line[i] === '/' && i + 1 < len && (line[i + 1] == '/' || line[i + 1] == '*'))) {
                                i++;
                            }
                            let tok = line.substring(start, i);
                            tokens.push(tok);
                            continue;
                        } else {
                            // 空白跳过
                            i++;
                        }
                    } else if (state === 'blockComment') {
                        if (ch === '*' && i + 1 < len && line[i + 1] === '/') {
                            state = 'normal';
                            i += 2;
                        } else {
                            i++;
                        }
                    } else {
                        i++;
                    }
                }
                return tokens; // 返回 token 数组
            }

            // 填充函数：在 token 数组的间隙插入注释，使行长度达到 targetLen
            // 参数 tokens: 原始 token 数组（每个 token 是字符串，如宏名、操作符、字符串字面量）
            // 返回填充后的字符串
            function insertPaddingFromTokens(tokens, targetLen) {
                if (tokens.length === 0) {
                    return ' '.repeat(targetLen);
                }

                // 计算基础长度（用单个空格分隔的字符串长度）
                const baseLen = tokens.join(' ').length;
                if (baseLen >= targetLen) {
                    return tokens.join(' '); // 已经足够，但通常不会
                }

                let need = targetLen - baseLen;

                // 间隙数量 = token数 + 1（开头和结尾）
                const gaps = tokens.length + 1;
                const fill = new Array(gaps).fill(0);

                // 随机分配 need 到各个间隙
                while (need > 0) {
                    const idx = Math.floor(Math.random() * gaps);
                    let len;
                    if (need >= 4) {
                        len = Math.floor(Math.random() * (need - 3)) + 4;
                    } else {
                        len = need;
                    }
                    fill[idx] += len;
                    need -= len;
                }

                // 构建最终行
                let result = '';

                // 开头填充
                if (fill[0] > 0) {
                    result += makePadding(fill[0]);
                }

                for (let i = 0; i < tokens.length; i++) {
                    result += tokens[i];
                    if (i < tokens.length - 1) {
                        result += ' ';
                        if (fill[i + 1] > 0) {
                            result += makePadding(fill[i + 1]);
                        }
                    } else {
                        if (fill[tokens.length] > 0) {
                            result += makePadding(fill[tokens.length]);
                        }
                    }
                }

                return result;
            }

            // 主混淆函数
            window.obfuscate = function () {
                const input = document.getElementById('input').value;
                if (!input.trim()) {
                    document.getElementById('output').value = '';
                    return;
                }

                const lines = input.split('\n');
                const preprocessLines = [];   // 预处理指令行（以#开头，忽略前面空白）
                const codeLines = [];         // 普通代码行

                for (let rawLine of lines) {
                    const trimmed = rawLine.trim();
                    if (trimmed.startsWith('#')) {
                        preprocessLines.push(rawLine);
                    } else {
                        if (rawLine.trim() !== '') {
                            codeLines.push(rawLine);
                        }
                    }
                }

                // 第一遍：收集所有代码行中的标识符
                const idSet = new Set();
                for (let line of codeLines) {
                    collectIdentifiers(line, idSet);
                }

                // 将标识符排序，分配宏名
                const sortedIds = Array.from(idSet).sort();
                const macroMap = new Map();
                let idx = 0;
                for (let i = 0; i < sortedIds.length; i++) {
                    macroMap.set(sortedIds[i], idxToMacro(idx, '_'));
                    idx++;
                }

                // 第二遍：替换每行代码，得到 token 数组
                const replacedTokensList = codeLines.map(line => replaceLine(line, macroMap));

                // 生成所有标识符的宏定义行
                const identMacroLines = [];
                for (let [ident, macro] of macroMap.entries()) {
                    identMacroLines.push(`#define ${macro} ${ident}`);
                }

                // 生成行宏定义：为每一行代码生成一个宏名，宏体为 token 数组用空格连接
                const lineMacroLines = [];
                const lineMacroNames = [];
                for (let i = 0; i < replacedTokensList.length; i++) {
                    const lineMacro = idxToMacro(idx, '_');
                    lineMacroNames.push(lineMacro);
                    const lineBody = replacedTokensList[i].join(' ');
                    lineMacroLines.push(`#define ${lineMacro} ${lineBody}`);
                    idx++;
                }

                // 生成顶级宏 _FINAL
                const finalMacroName = '_FINAL';
                const finalMacroBody = lineMacroNames.join(' ');
                const finalMacroLine = `#define ${finalMacroName} ${finalMacroBody}`;
                const finalCallLine = finalMacroName;

                // 收集所有需要填充长度的行
                const allLinesToPad = [
                    ...identMacroLines,
                    ...lineMacroLines,
                    finalMacroLine,
                    finalCallLine
                ];

                // 计算最大长度
                let maxLen = 0;
                for (let line of allLinesToPad) {
                    if (line.length > maxLen) maxLen = line.length;
                }
                const targetLen = maxLen + Math.floor(Math.random() * 20) + 10;

                // 填充函数：对于普通宏定义行，我们需要将其拆分为 token 数组吗？不，这些行是简单的 #define 宏 值，值中可能包含空格（比如行宏体），但行宏体已经是空格连接的 token，我们需要保留其结构。实际上，对于 #define 行，我们也可以将其视为 token 数组：["#define", macro, ...] 但为了简化，我们仍使用字符串填充，但注意这些行的值部分可能包含空格（如行宏体），但行宏体本身是由 token 组成的，如果我们用 split 会再次拆分字符串字面量？不，行宏体中的字符串字面量已经是完整的，例如 `"\n\nError : 111 111 111"` 作为一个 token 被连接时，它本身没有内部空格？实际上它内部有空格，但作为字符串，它在 join 时被当作一个整体，所以行宏体字符串是 `_000AAB << "\n\nError : 111 111 111"`，其中字符串部分包含空格，但整体是连续的。当我们用 split 分割这个字符串时，空格仍然会分割它！所以对于行宏定义，其值部分也可能包含带空格的字符串，我们需要同样处理。

                // 因此，我们需要对每一行进行 token 化填充。但行宏定义本身是一个字符串，我们如何安全地填充？我们可以将每行视为由固定部分和可变部分组成，但最安全的方法是：对于标识符宏定义，其值只是一个标识符，没有空格；对于行宏定义，其值是 token 连接而成，我们实际上已经有了该行的 token 数组（replacedTokensList[i]），所以我们可以基于 token 数组构建填充，而不是基于字符串。

                // 更好的做法：为每一行（包括标识符宏定义）也保存 token 数组，然后统一用 insertPaddingFromTokens 填充。
                // 标识符宏定义可以看作 token 数组：["#define", macro, ident]
                // 行宏定义：["#define", lineMacro, ...] 其中第三个及以后的 token 是 replacedTokensList[i] 展开的 token 数组。
                // 最终宏定义：["#define", finalMacroName, ...] 其中第三个及以后的 token 是 lineMacroNames 数组（每个是宏名）。
                // 最终调用行：["_FINAL"]

                // 因此，我们需要为每行构建 token 数组，然后填充。

                function buildTokenArrayForDefine(macro, valueTokens) {
                    // valueTokens 可以是字符串数组（如标识符的单个 token，或多个 token）
                    return ['#define', macro, ...valueTokens];
                }

                // 构建所有行的 token 数组
                const linesToPadTokens = [];

                // 标识符宏定义
                for (let [ident, macro] of macroMap.entries()) {
                    linesToPadTokens.push(buildTokenArrayForDefine(macro, [ident]));
                }

                // 行宏定义
                for (let i = 0; i < replacedTokensList.length; i++) {
                    const lineMacro = lineMacroNames[i];
                    linesToPadTokens.push(buildTokenArrayForDefine(lineMacro, replacedTokensList[i]));
                }

                // 最终宏定义
                linesToPadTokens.push(buildTokenArrayForDefine(finalMacroName, lineMacroNames));

                // 最终调用行
                linesToPadTokens.push([finalMacroName]);

                // 计算最大长度：先计算每个 token 数组用空格连接的长度
                let maxBaseLen = 0;
                for (let tokens of linesToPadTokens) {
                    const len = tokens.join(' ').length;
                    if (len > maxBaseLen) maxBaseLen = len;
                }
                const targetLen2 = maxBaseLen + Math.floor(Math.random() * 20) + 10;

                // 对每个 token 数组进行填充
                const paddedLines = linesToPadTokens.map(tokens => insertPaddingFromTokens(tokens, targetLen2));

                // 组装输出
                let output = '';
                for (let pl of preprocessLines) {
                    output += pl + '\n';
                }
                if (preprocessLines.length > 0) output += '\n';

                for (let line of paddedLines) {
                    output += line + '\n';
                }

                document.getElementById('output').value = output;
            };
        })();
    </script>
</body>

</html>
